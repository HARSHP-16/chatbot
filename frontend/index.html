<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCopilot</title>
    <!-- Google Fonts for Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar or Header Menu -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🎓</span> 
                CampusCopilot
            </div>
            <div class="controls">
                <select id="language-select" class="lang-dropdown">
                    <option value="en">English</option>
                    <option value="hi">हिंदी (Hindi)</option>
                    <option value="mr">मराठी (Marathi)</option>
                </select>
                <div class="user-profile">
                    S
                </div>
            </div>
        </header>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <div id="chat-messages" class="messages-container">
                <!-- Messages will be appended here dynamically -->
                <div class="message bot">
                    <div class="avatar">🤖</div>
                    <div class="bubble">Hello! I am CampusCopilot. How can I help you with your campus queries today?</div>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="input-area">
            <form id="chat-form" class="input-form">
                <input type="text" id="chat-input" placeholder="Ask about events, timetables, or campus locations..." autocomplete="off" />
                <button type="submit" id="send-btn" class="send-btn">
                    <!-- Send SVG icon -->
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </footer>
    </div>
    <script src="./script.js"></script>
</body>
</html>
