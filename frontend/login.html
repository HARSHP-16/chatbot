<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | UniMind AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <!-- Navbar stub for auth pages -->
    <nav class="navbar" style="background: transparent; border: none; backdrop-filter: none;">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="url(#paint0_linear)"/>
                    <path d="M2 17L12 22L22 17" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="var(--tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <defs>
                        <linearGradient id="paint0_linear" x1="12" y1="2" x2="12" y2="12" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#6366f1"/>
                            <stop offset="1" stop-color="#0ea5e9"/>
                        </linearGradient>
                    </defs>
                </svg>
                UniMind
            </a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p class="text-muted">Sign in to sync your campus experience</p>
            </div>
            
            <div class="role-selector">
                <button class="role-btn active">Student</button>
                <button class="role-btn">Faculty</button>
                <button class="role-btn">Admin</button>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input id="loginEmail" type="email" class="form-control" placeholder="you@university.edu" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="password-row">
                        <input id="loginPassword" type="password" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="pwd-toggle" data-target="loginPassword">Show</button>
                    </div>
                </div>
                <small id="loginError" class="form-error"></small>
                <small id="loginSuccess" class="form-success"></small>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
            </form>

            <div class="demo-credentials">
                <p class="text-muted">Demo logins: student@campus.edu / student123, faculty@campus.edu / faculty123, admin@campus.edu / admin123</p>
            </div>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Register</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
