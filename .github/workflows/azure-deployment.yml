name: Deploy to Azure App Service

on:
  push:
    branches: [ main, master, deployment ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python version
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Create and start virtual environment
      run: |
        python -m venv venv
        source venv/bin/activate

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run tests (optional)
      run: |
        # Add your test commands here if you have tests
        echo "No tests configured yet"

    - name: Upload artifact for deployment jobs
      uses: actions/upload-artifact@v4
      with:
        name: python-app
        path: |
          .
          !venv/

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: python-app
        path: .

    - name: Validate Azure auth secrets
      shell: bash
      run: |
        if [[ -n "$AZURE_CREDENTIALS" ]]; then
          echo "Using AZURE_CREDENTIALS secret for Azure login."
          exit 0
        fi

        missing=()
        [[ -z "$AZURE_CLIENT_ID" ]] && missing+=("AZURE_CLIENT_ID")
        [[ -z "$AZURE_TENANT_ID" ]] && missing+=("AZURE_TENANT_ID")
        [[ -z "$AZURE_SUBSCRIPTION_ID" ]] && missing+=("AZURE_SUBSCRIPTION_ID")

        if (( ${#missing[@]} > 0 )); then
          echo "::error::Missing required GitHub secrets: ${missing[*]}"
          exit 1
        fi

    - name: Login to Azure (credentials JSON)
      if: ${{ env.AZURE_CREDENTIALS != '' }}
      uses: azure/login@v2
      with:
        creds: ${{ env.AZURE_CREDENTIALS }}

    - name: Login to Azure (service principal fields)
      if: ${{ env.AZURE_CREDENTIALS == '' }}
      uses: azure/login@v2
      with:
        auth-type: SERVICE_PRINCIPAL
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'unimind-chatbot'
        slot-name: 'production'
        package: .
        startup-command: 'bash startup.sh'

    - name: Azure logout
      run: az logout
